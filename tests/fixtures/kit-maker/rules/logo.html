<!doctype html>
<html>
<head>
<style>
  html, body { margin: 0; width: var(--kit-width); height: var(--kit-height); overflow: hidden; background: #202020; }
  img { display: block; }
  #plain { position: absolute; right: 120px; bottom: 300px; width: 300px; height: 75px; }
  #icon { position: absolute; left: 584px; top: 150px; width: 180px; height: 180px; border-radius: 50%; }
  #icon img { width: 100%; height: 100%; object-fit: cover; }
  #frame { position: absolute; left: 50px; top: 50px; width: 200px; height: 100px; padding: 10px; border: 5px solid #fff; overflow: hidden; }
  #frame img { width: 400px; height: 100px; }
  #padded { position: absolute; left: 300px; top: 600px; width: 200px; height: 200px; padding: 20px; border: 10px solid #fff; object-fit: contain; }
  #escape { width: 100px; height: 100px; overflow: hidden; }
  #escape img { position: absolute; left: 700px; top: 900px; width: 240px; height: 60px; }
</style>
</head>
<body>
  <script>
    // One layout per run, named by values.layout; each draws kit.brand.logo once.
    var logo = '<img src="' + kit.brand.logo + '" alt="">';
    var layouts = {
      plain: '<img id="plain" src="' + kit.brand.logo + '" alt="">',
      cover: '<div id="icon">' + logo + '</div>',
      clipped: '<div id="frame">' + logo + '</div>',
      padded: '<img id="padded" src="' + kit.brand.logo + '" alt="">',
      escape: '<div id="escape">' + logo + '</div>'
    };
    document.body.insertAdjacentHTML('beforeend', layouts[kit.values.layout]);
    kit.render(function () {});
  </script>
</body>
</html>
