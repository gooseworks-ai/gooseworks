<html lang="en">
<head>
<link rel="stylesheet" href="search-grid.css">
</head>

    <div id="scrim"></div>
    <div id="searchwrap"><div id="searchbar">
      <div id="query"><span id="typed"></span><span id="caret"></span></div>
      <img id="mag" src="magnifier.svg" alt="">
    </div></div>

  <div id="beat-stack" class="layer"><div id="stack-bg"></div><div id="stack-cards"></div></div>
  <div id="beat-features" class="layer"><div id="feat-track"></div></div>
  <div id="beat-end" class="layer"><div id="ec-inner">
    <div id="ec-hero"><img id="ec-hero-img" alt=""></div>
    <img id="ec-logo" alt="">
    <div id="ec-cta"></div>
  </div></div>
</div>
<script src="search-grid.js"></script>
</body>
</html>
