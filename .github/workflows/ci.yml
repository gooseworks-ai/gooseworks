name: CLI checks
on:
  pull_request:
    branches: [dev, main, video-merged, 'video/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The kit's web maker renders in Chromium's headless shell; its media tests
      # run only where that browser exists, found through PLAYWRIGHT_BROWSERS_PATH.
      - name: Install the video browser
        run: npx playwright-core install --with-deps --only-shell chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-playwright
      - run: node scripts/check-changeset.cjs
      - run: npm run generate:skills
      - run: git diff --exit-code -- skills
      - run: npm run build
      - run: npm test -- --runInBand
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-playwright
      - name: Test the shipped package
        run: |
          npm pack --ignore-scripts --json > packed.json
          node scripts/pack-smoke.cjs "$(node -p 'require("./packed.json")[0].filename')"
