name: Video local media

on:
  pull_request:
  push:
    branches: [main]

jobs:
  captions:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: npm run build
      - run: npm test -- --runInBand
        env:
          VIDEO_LOCAL_MEDIA_TEST: '1'
